<style>
/* ═══════════════════════════════════════════════════════════
   TOKENS GLOBAUX — Material Design 3 + thèmes
═══════════════════════════════════════════════════════════ */
:root {
  --font-sans: 'DM Sans', sans-serif;
  --font-display: 'DM Serif Display', serif;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --shadow-1: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
  --shadow-2: 0 3px 8px rgba(0,0,0,.15), 0 2px 4px rgba(0,0,0,.10);
  --shadow-3: 0 8px 24px rgba(0,0,0,.18);
  --transition: 180ms cubic-bezier(.2,.0,.2,1);
  --container-pad: 24px;
}

/* ── Identité SiteForge : encre & laiton ──────────────────────
   Un seul système de couleurs, décliné en 3 thèmes exclusifs :
   clair (papier), sombre (encre), haut contraste (WCAG AAA).
   Plus de tokens "container" MD3 — teintes dérivées directement. */

/* ── Thème Clair ── */
[data-theme="light"] {
  --c-primary:       #194F49;   /* encre teal */
  --c-primary-cont:  #DCEBE8;
  --c-secondary:     #92652C;   /* laiton */
  --c-tertiary:      #5B4C7A;   /* violet sourdine, accents rares */
  --c-surface:       #FBFAF7;
  --c-surface-1:     #F2F0EA;
  --c-surface-2:     #E8E5DC;
  --c-surface-3:     #DEDACD;
  --c-on-surface:    #1C2023;
  --c-on-surface-v:  #52565A;
  --c-outline:       #C9C4B7;
  --c-outline-v:     #E2DFD5;
  --c-error:         #A3312A;
  --c-bg:            #F2F0EA;
}

/* ── Thème Sombre ── */
[data-theme="dark"] {
  --c-primary:       #5FBAB0;
  --c-primary-cont:  #1F5C56;
  --c-secondary:     #D9A455;
  --c-tertiary:      #A491C4;
  --c-surface:       #1A1F21;
  --c-surface-1:     #20262A;
  --c-surface-2:     #262D31;
  --c-surface-3:     #2D3539;
  --c-on-surface:    #E7E4DC;
  --c-on-surface-v:  #A9A79D;
  --c-outline:       #3C4448;
  --c-outline-v:     #2A3134;
  --c-error:         #F0938A;
  --c-bg:            #14181A;
}

/* ── Thème Haut Contraste (WCAG AAA, ≥7:1) ── */
[data-theme="hc"] {
  --c-primary:       #00453E;
  --c-primary-cont:  #FFFFFF;
  --c-secondary:     #5C3A00;
  --c-tertiary:      #2E1A5C;
  --c-surface:       #FFFFFF;
  --c-surface-1:     #F2F2F2;
  --c-surface-2:     #E5E5E5;
  --c-surface-3:     #D9D9D9;
  --c-on-surface:    #000000;
  --c-on-surface-v:  #1A1A1A;
  --c-outline:       #000000;
  --c-outline-v:     #333333;
  --c-error:         #A30000;
  --c-bg:            #FFFFFF;
}

/* ═══════════════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: var(--font-sans); }
body {
  background: var(--c-bg);
  color: var(--c-on-surface);
  display: flex; flex-direction: column;
  transition: background var(--transition), color var(--transition);
}
button { font-family: var(--font-sans); cursor: pointer; border: none; outline: none; }
input, textarea, select { font-family: var(--font-sans); }
.ms { font-family: 'Material Symbols Outlined'; font-style: normal; font-weight: normal;
       line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap;
       word-wrap: normal; direction: ltr; font-size: 20px; user-select: none; }

/* ═══════════════════════════════════════════════════════════
   TOPBAR
═══════════════════════════════════════════════════════════ */
#topbar {
  display: flex; align-items: center; gap: 4px;
  padding: 0 12px;
  height: 56px; min-height: 56px;
  background: var(--c-surface);
  border-bottom: 1px solid var(--c-outline-v);
  box-shadow: var(--shadow-1);
  z-index: 400; flex-shrink: 0;   /* nettement au-dessus des modules du canevas (navbar=100, etc.) */
  transition: background var(--transition), border-color var(--transition);
}
#topbar .brand {
  font-family: var(--font-display);
  font-size: 20px; font-weight: 400;
  color: var(--c-primary);
  margin-right: 8px; white-space: nowrap;
  flex-shrink: 0;
}
.tb-sep { width: 1px; height: 24px; background: var(--c-outline-v); margin: 0 2px; flex-shrink: 0; }
.tb-group { display: flex; align-items: center; gap: 1px; }

/* Boutons topbar — icône seule, compact */
.tb-btn {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  padding: 5px 7px; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 500;
  background: transparent; color: var(--c-on-surface-v);
  transition: background var(--transition), color var(--transition);
  white-space: nowrap; position: relative;
}
.tb-btn:hover { background: var(--c-surface-2); color: var(--c-on-surface); }
.tb-btn.active { background: var(--c-primary-cont); color: var(--c-primary); }
.tb-btn .ms { font-size: 20px; }
/* Chevron des menus déroulants */
.tb-btn .tb-chevron { font-size: 14px; margin-left: -2px; }
.tb-spacer { flex: 1; }

/* Tooltip natif amélioré */
.tb-btn[title]:hover::after {
  content: attr(title);
  position: absolute; top: calc(100% + 6px); left: 50%;
  transform: translateX(-50%);
  background: #1e2128; color: #e2e5ee;
  font-size: 11px; font-weight: 500; white-space: nowrap;
  padding: 4px 8px; border-radius: 4px;
  pointer-events: none; z-index: 1000;
}

/* ── Barre de prévisualisation ── */
#preview-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px;
  height: 38px; min-height: 38px;
  background: var(--c-surface-1);
  border-bottom: 1px solid var(--c-outline-v);
  flex-shrink: 0; z-index: 90;
}
.pvbar-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--c-on-surface-v);
  white-space: nowrap;
}
.pvbar-btns {
  display: flex; gap: 2px;
  background: var(--c-surface-2);
  border: 1px solid var(--c-outline-v);
  border-radius: 20px; padding: 2px;
}
.pvbar-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 3px 12px; border-radius: 16px;
  font-size: 12px; font-weight: 500;
  color: var(--c-on-surface-v); background: transparent;
  transition: background var(--transition), color var(--transition);
  white-space: nowrap;
}
.pvbar-btn:hover { color: var(--c-on-surface); }
.pvbar-btn.active {
  background: var(--c-surface); color: var(--c-primary);
  box-shadow: 0 1px 4px rgba(0,0,0,.12);
  font-weight: 600;
}
.pvbar-btn .ms { font-size: 16px; }
.pvbar-txt { font-size: 12px; }
.pvbar-size {
  margin-left: auto;
  font-size: 11px; font-weight: 500;
  color: var(--c-on-surface-v);
  font-variant-numeric: tabular-nums;
}

/* Dropdown Menu */
.dropdown { position: relative; }
.dropdown-menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 999;
  background: var(--c-surface);
  border: 1px solid var(--c-outline-v);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-3);
  min-width: 200px; overflow: hidden;
  display: none;
  transition: background var(--transition);
}
.dropdown-menu.open { display: block; }
.dm-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; font-size: 13px; font-weight: 500;
  color: var(--c-on-surface-v);
  cursor: pointer; transition: background var(--transition);
}
.dm-item:hover { background: var(--c-surface-2); color: var(--c-on-surface); }
.dm-item.active { background: var(--c-primary-cont); font-weight: 600; }
.dm-item.active .ms { color: var(--c-primary); }
.dm-item.dm-item-publish { color: var(--c-primary); font-weight: 600; }
.dm-item.dm-item-publish .ms { color: var(--c-primary); }
.dm-item.dm-item-publish:hover { background: var(--c-primary-cont); }
.dm-item .ms { font-size: 18px; color: var(--c-primary); }
.dm-sep { height: 1px; background: var(--c-outline-v); margin: 4px 0; }
.dm-title { padding: 8px 16px 4px; font-size: 11px; font-weight: 600;
             text-transform: uppercase; letter-spacing: .08em; color: var(--c-on-surface-v); }

/* ═══════════════════════════════════════════════════════════
   MAIN LAYOUT
═══════════════════════════════════════════════════════════ */
#main {
  display: flex; flex: 1;
  overflow: hidden;        /* garde le scroll général */
  min-height: 0;
  position: relative;      /* contexte pour les onglets fixed */
}

/* Le panneau interne peut dépasser tout en gardant son propre scroll */
#props-panel { overflow: hidden; }   /* hidden pour que flex-child puisse scroller */
#props-panel > *:not(#props-toggle) { overflow: visible; }

/* Barre d'onglets des modules */
#module-tabs-bar {
  display: flex; align-items: center; gap: 4px;
  padding: 0 8px; height: 40px; flex-shrink: 0;
  background: var(--c-surface-1); border-bottom: 1px solid var(--c-outline-v);
  overflow-x: auto; overflow-y: hidden;
}
#module-tabs { display: flex; align-items: stretch; gap: 2px; min-width: 0; }
.module-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 0 8px 0 10px; height: 32px; margin: 4px 0;
  border-radius: var(--radius-sm);
  font-size: 12.5px; font-weight: 500; white-space: nowrap;
  color: var(--c-on-surface-v); cursor: pointer;
  transition: background var(--transition);
  max-width: 200px;
}
.module-tab:hover { background: var(--c-surface-2); }
.module-tab.active { background: var(--c-primary-cont); color: var(--c-primary); }
.module-tab .ms { font-size: 16px; flex-shrink: 0; }
.module-tab-label {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  outline: none;
}
.module-tab-label[contenteditable="true"] {
  background: var(--c-surface-2); border-radius: 4px; padding: 0 3px;
}
.module-tab-dup, .module-tab-close {
  display: none; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
  color: inherit; opacity: .7;
}
.module-tab-dup:hover, .module-tab-close:hover { background: rgba(0,0,0,.12); opacity: 1; }
.module-tab:hover .module-tab-dup, .module-tab:hover .module-tab-close,
.module-tab.active .module-tab-dup, .module-tab.active .module-tab-close { display: flex; }
.module-tab-dup .ms, .module-tab-close .ms { font-size: 13px; }
.module-tab.sortable-ghost { opacity: .4; }
#module-tab-add {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  color: var(--c-on-surface-v);
}
#module-tab-add:hover { background: var(--c-surface-2); }
#module-tab-add .ms { font-size: 20px; }

/* ── Canvas zone ── */
#canvas-wrap {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: safe center;
  overflow-y: auto; overflow-x: hidden;
  background: var(--c-bg);
  padding: 24px 24px 60px;
  transition: background var(--transition);
}
#canvas-frame {
  width: 100%; max-width: 1200px;
  background: var(--c-surface);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-2);
  overflow: hidden;
  transition: width var(--transition), max-width var(--transition),
              background var(--transition), box-shadow var(--transition);
}
#canvas-frame.preview-tablet { max-width: 768px; }
#canvas-frame.preview-mobile { max-width: 390px; }

/* Canvas drop zone — s'adapte à la taille du module, pas de hauteur imposée */
#canvas {
  padding: 0;
  position: relative;
}
#canvas.drag-over::after {
  content: '';
  position: absolute; inset: 0; z-index: 100; pointer-events: none;
  outline: 3px dashed var(--c-primary);
  outline-offset: -3px;
  background: rgba(21, 101, 192, .06);
  border-radius: var(--radius-sm);
}
.canvas-empty {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px;
  padding: 80px 20px; text-align: center;
  color: var(--c-on-surface-v); pointer-events: none;
}
.canvas-empty .ms { font-size: 48px; opacity: .4; }
.canvas-empty p { font-size: 15px; opacity: .6; }

/* ── Properties panel (droite) ── */
#props-panel {
  width: 280px; min-width: 280px;
  background: var(--c-surface);
  border-left: 1px solid var(--c-outline-v);
  display: flex; flex-direction: column;
  overflow-y: auto; overflow-x: hidden;
  transition: background var(--transition), width 240ms cubic-bezier(.4,0,.2,1),
              min-width 240ms cubic-bezier(.4,0,.2,1), opacity 200ms;
  flex-shrink: 0;
  position: relative;
}
#props-panel.hidden { display: none; }
#props-panel.collapsed {
  width: 0 !important; min-width: 0 !important;
  overflow: hidden; opacity: 0;
}

/* Poignée de rabattement props panel — style épuré inline */
#props-toggle {
  position: absolute; top: 50%; left: -12px;
  transform: translateY(-50%);
  width: 12px; height: 40px;
  background: var(--c-surface-2);
  border: 1px solid var(--c-outline);
  border-right: none;
  border-radius: 4px 0 0 4px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 210;
  color: var(--c-on-surface-v);
  transition: background var(--transition), color var(--transition), border-color var(--transition);
}
#props-toggle:hover { background: var(--c-primary-cont); border-color: var(--c-primary); color: var(--c-primary); }
#props-toggle .ms { font-size: 11px; }

/* Bouton flottant pour rouvrir le panel quand fermé */
#props-reopen {
  position: fixed; right: 0; top: 50%;
  transform: translateY(-50%);
  width: 14px; height: 40px;
  background: var(--c-surface-2);
  border: 1px solid var(--c-outline);
  border-right: none;
  border-radius: 4px 0 0 4px;
  display: none; align-items: center; justify-content: center;
  cursor: pointer; z-index: 300;
  color: var(--c-on-surface-v);
  transition: background var(--transition), color var(--transition);
}
#props-reopen:hover { background: var(--c-primary-cont); color: var(--c-primary); }
#props-reopen.show { display: flex; }
#props-reopen .ms { font-size: 11px; }
.pp-sep { height: 1px; background: var(--c-outline-v); margin: 8px 0; }
.pp-hint { font-size: 11px; color: var(--c-on-surface-v); line-height: 1.5; }
.pp-check-row { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.pp-slider-val { text-align: right; font-size: 11px; color: var(--c-on-surface-v); margin-top: 2px; }

/* Toolbar lien inline flottant */
#inline-link-bar {
  position: fixed; z-index: 500;
  display: none; align-items: center; gap: 4px;
  background: #1e2128;
  border-radius: 8px; padding: 5px 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,.32), 0 0 0 1px rgba(255,255,255,.06);
  color: #fff; font-size: 12px; white-space: nowrap;
}
#inline-link-bar.show { display: flex; }
#inline-link-bar select {
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
  border-radius: 5px; color: #fff; padding: 3px 5px; font-size: 11px;
  max-width: 100px; outline: none; cursor: pointer;
}
#inline-link-bar select option { background: #1e2128; color: #fff; }
#inline-link-bar input[type="url"] { display: none; } /* caché, géré dans le popup */

/* Popup lien */
#ilb-link-popup {
  position: fixed; z-index: 501;
  display: none;
  flex-direction: column; gap: 6px;
  background: #1e2128;
  border-radius: 10px; padding: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.07);
  min-width: 240px;
}
#ilb-link-popup.show { display: flex; }
.ilp-row { display: flex; align-items: center; gap: 6px; }
.ilp-row input[type="url"] {
  flex: 1; background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 5px; color: #fff; padding: 5px 8px; font-size: 12px; outline: none;
}
.ilp-row input[type="url"]::placeholder { color: rgba(255,255,255,.4); }
.ilp-apply {
  width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
  background: var(--c-primary); color: #fff;
  display: flex; align-items: center; justify-content: center; border: none; cursor: pointer;
}
.ilp-apply .ms { font-size: 16px; }
.ilp-sep { height: 1px; background: rgba(255,255,255,.1); margin: 2px 0; }
.ilp-label { font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: rgba(255,255,255,.45); padding: 0 2px; }
.ilp-page-btn {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 7px 8px; border-radius: 6px;
  background: transparent; color: rgba(255,255,255,.8);
  font-size: 12px; text-align: left; border: none; cursor: pointer;
  transition: background 100ms;
}
.ilp-page-btn:hover { background: rgba(255,255,255,.12); color: #fff; }
.ilp-page-btn .ms { font-size: 14px; opacity: .6; flex-shrink: 0; }
#inline-link-bar input[type="number"] {
  background: transparent; border: none;
  color: #fff; padding: 2px 0; font-size: 12px;
  width: 34px; outline: none; text-align: center;
}
#inline-link-bar input::placeholder { color: rgba(255,255,255,.4); }
#inline-link-bar input:focus { border-color: rgba(255,255,255,.4); }
.ilb-btn {
  width: 26px; height: 26px; border-radius: 4px; background: transparent;
  color: rgba(255,255,255,.75); display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 100ms, color 100ms;
}
.ilb-btn:hover { background: rgba(255,255,255,.16); color: #fff; }
.ilb-btn.active { background: rgba(255,255,255,.22); color: #fff; }
.ilb-btn .ms { font-size: 15px; line-height: 1; }
.ilb-sep { width: 1px; height: 16px; background: rgba(255,255,255,.18); margin: 0 2px; flex-shrink: 0; }
/* Lien de bloc - visuellement transparent dans l'éditeur */
.block-link-wrap { display: contents; }
.mod-content a[data-block-link] { color: inherit; text-decoration: none; display: block; }

/* ── Module Partition (Sheet) — couleurs fixes (identiques light/dark) ── */
.mod-sheet { padding: 0; color-scheme: light; }
.sm-title { font-size: 17px; font-weight: 600; color: #1A1C22; margin-bottom: 10px; }
.sm-staff-view {
  background: #fff; border: 1px solid #ddd;
  border-radius: 8px; min-height: 60px; overflow: hidden; position: relative;
  color: #000;  /* force currentColor → noir pour le SVG abcjs */
}
.sm-staff-wrapper {
  background: #fff; border-radius: 8px; border: 1px solid #ddd;
  min-height: 55px; overflow: hidden; position: relative;
  display: flex; align-items: center; justify-content: center;
  color: #000;
}
.sm-staff-view svg,
.sm-staff-wrapper svg { display: block; width: 100% !important; }
/* Curseur et surlignage lecture */
.sm-staff-view svg .sm-cursor-line,
.sm-staff-wrapper svg .sm-cursor-line { stroke: rgba(21,101,192,.65) !important; fill: none !important; stroke-width: 2.5px !important; }
.sm-staff-view svg .sm-playing *,
.sm-staff-wrapper svg .sm-playing *   { fill: #1565C0 !important; stroke: none !important; }
/* Notes cliquables dans l'éditeur */
#sm-user-staff .abcjs-note { cursor: pointer; }
#sm-user-staff .abcjs-bar  { cursor: pointer; }
.sm-staff-placeholder { text-align: center; padding: 24px; color: #777; font-size: 13px; line-height: 1.8; }

/* Bouton ▶ overlay */
.sm-play-btn {
  position: absolute; bottom: 8px; right: 8px; z-index: 20;
  width: 40px; height: 40px; border-radius: 50%;
  background: #1565C0; color: #fff;
  border: none; font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.28);
  transition: transform 120ms;
}
.sm-play-btn:hover { transform: scale(1.08); background: #0d47a1; }
.sm-play-btn[data-playing="1"] { background: #0d47a1; }

/* Ligne de contrôles (transpose + tempo) — fond fixe */
.sm-controls-row {
  display: flex; align-items: center; gap: 6px;
  margin-top: 7px;
  background: #f5f5f5; border-radius: 8px; padding: 6px 10px;
  flex-wrap: wrap;
}
.sm-ctrl-sep { width: 1px; height: 20px; background: #ddd; margin: 0 2px; flex-shrink: 0; }
.sm-tp-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: #e8e8e8; border: 1px solid #ccc;
  color: #333; font-size: 13px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 100ms; flex-shrink: 0; touch-action: manipulation;
}
.sm-tp-btn:hover { background: #dce8f5; border-color: #1565C0; color: #1565C0; }
.sm-tp-reset { font-size: 14px; }
.sm-tp-val {
  font-size: 11px; font-weight: 700; color: #1565C0;
  min-width: 32px; text-align: center; font-family: monospace; flex-shrink: 0;
}
.sm-tempo-step {
  width: 32px; height: 32px; border-radius: 50%;
  background: #e8e8e8; border: 1px solid #ccc;
  color: #333; font-size: 20px; font-weight: 300; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 100ms; flex-shrink: 0; touch-action: manipulation;
}
.sm-tempo-step:hover { background: #dce8f5; border-color: #1565C0; color: #1565C0; }
.sm-tempo-val {
  font-size: 12px; font-weight: 700; color: #1565C0;
  min-width: 58px; text-align: center; font-family: monospace; flex-shrink: 0;
}
.sm-loop-btn {
  width: 30px; height: 30px; border-radius: 50%;
  background: #e8e8e8; border: 1px solid #ccc;
  font-size: 13px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  flex-shrink: 0; opacity: 0.45; transition: opacity 120ms, background 120ms;
  touch-action: manipulation;
}
.sm-loop-btn:hover { opacity: 0.75; }
.sm-loop-btn.active { opacity: 1; background: #dce8f5; border-color: #1565C0; }

/* ── Modale éditeur partition ─────────────────────────── */
#modal-sheet .modal { max-width: 740px; width: 95vw; max-height: 92vh; display: flex; flex-direction: column; }
.sm-modal-body { flex:1; overflow-y:auto; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 8px; }
.sm-mode-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 4px; }
.sm-staff-mode-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--c-surface-1); border: 1px solid var(--c-outline-v);
  border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 12px; font-weight: 600;
  color: var(--c-on-surface-v); transition: background 120ms;
}
.sm-staff-mode-btn:hover { background: var(--c-primary-cont); border-color: var(--c-primary); color: var(--c-primary); }
.sm-toolbar { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.sm-toolbar-sep { width:1px; height:22px; background:var(--c-outline-v); margin:0 3px; flex-shrink:0; }
.sm-btn-dur, .sm-btn-alt {
  min-width:40px; min-height:40px; padding:4px 8px;
  background:var(--c-surface-1); border:1px solid var(--c-outline-v); border-radius:6px;
  font-size:1.1rem; display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer; transition:background 100ms; line-height:1; touch-action:manipulation;
}
.sm-btn-dur:hover, .sm-btn-alt:hover { background: var(--c-surface-2); }
.sm-btn-dur.active, .sm-btn-alt.active {
  background: var(--c-primary-cont); border: 2px solid var(--c-primary); color: var(--c-primary); font-weight: 700;
}
.sm-alt-status { font-size:11px; color:var(--c-on-surface-v); min-width:16px; }
.sm-alt-status.active { color:var(--c-primary); font-weight:700; }
.sm-click-overlay { position:absolute; inset:0; cursor:crosshair; z-index:10; border-radius:8px; }
.sm-ghost-note {
  position:absolute; width:18px; height:11px; background:rgba(74,124,89,.35);
  border:2px solid rgba(74,124,89,.85); border-radius:50%; pointer-events:none;
  display:none; transform:translate(-50%,-50%); z-index:11; transition:top .04s;
}

/* Grille de padding 3×3 — steppers tactiles */

}

}

.youtube-placeholder {
  position: absolute; inset: 0; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; background: var(--c-surface-2); color: var(--c-on-surface-v);
}
.youtube-placeholder .ms { font-size: 48px; color: #FF0000; opacity: .7; }

/* ── MODULE : Drive Embed ── */
.mod-drive-embed { padding: 0; }
.drive-wrap {
  border-radius: var(--radius-md); overflow: hidden;
  box-shadow: var(--shadow-2); background: var(--c-surface-1);
}
.drive-wrap iframe { width: 100%; border: none; display: block; height: 500px; }

/* Zones de dépôt imbriquées (onglets, colonnes) */
.nested-drop-zone {
  min-height: 80px; padding: 6px;
  border-radius: var(--radius-sm);
  border: 1.5px dashed var(--c-outline);
  transition: background var(--transition), border-color var(--transition);
  position: relative;
}
.nested-drop-zone.drag-over {
  background: var(--c-primary-cont);
  border-color: var(--c-primary);
  border-style: solid;
}
.zone-add-btn {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  width: 100%; padding: 7px 4px; margin-top: 2px;
  border-radius: var(--radius-sm);
  border: 1.5px dashed var(--c-outline);
  background: none; color: var(--c-on-surface-v);
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  cursor: pointer; transition: background var(--transition), border-color var(--transition), color var(--transition);
}
.zone-add-btn:hover { background: var(--c-primary-cont); border-color: var(--c-primary); color: var(--c-primary); }
.zone-add-btn .ms { font-size: 15px; }
.nested-drop-zone:has(.sf-module) .zone-add-btn { border-style: solid; margin-top: 6px; }
/* Fallback si :has() non supporté */
.nested-drop-zone.has-modules .zone-add-btn { border-style: solid; margin-top: 6px; }
.zone-add-menu {
  position: fixed; z-index: 9999;
  background: var(--c-surface);
  border: 1px solid var(--c-outline-v);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-3);
  min-width: 190px; max-height: 300px; overflow-y: auto;
}
.zone-add-menu .dm-item { padding: 8px 14px; font-size: 12.5px; }

/* Modules dans zones imbriquées — toolbar plus discrète */
.nested-drop-zone .sf-module { margin: 4px 0; }
.nested-drop-zone .module-toolbar { top: -26px; }
.nested-drop-zone .sf-module:first-child { margin-top: 0; }
.mod-tabs { padding: 0; }

/* Style commun aux deux variantes */
.tabs-body { padding: 4px 0 8px; }
.tab-pane { display: none; }
.tab-pane.active { display: block; }
.tab-canvas { min-height: 60px; }

/* ── Variante PILL (capsule) ── */
.tabs-header.style-pill {
  display: inline-flex;
  background: var(--c-surface-2);
  border-radius: 10px;
  padding: 4px; gap: 2px;
  border: 1px solid var(--c-outline-v);
  margin-bottom: 16px;
  max-width: 100%; overflow-x: auto;
  scrollbar-width: none;
}
.tabs-header.style-pill::-webkit-scrollbar { display: none; }
.tabs-header.style-pill .tab-btn {
  padding: 6px 18px; font-size: 13px; font-weight: 500;
  border-radius: 7px; background: transparent;
  color: var(--c-on-surface-v); border: none; white-space: nowrap;
  transition: color var(--transition), background var(--transition), box-shadow var(--transition);
}
.tabs-header.style-pill .tab-btn:hover { color: var(--c-on-surface); background: rgba(255,255,255,.55); }
.tabs-header.style-pill .tab-btn.active {
  background: var(--c-surface); color: var(--c-primary); font-weight: 600;
  box-shadow: 0 1px 4px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04);
}

/* ── Variante UNDERLINE (soulignée) ── */
.tabs-header.style-underline {
  display: flex;
  border-bottom: 2px solid var(--c-outline-v);
  gap: 0; overflow-x: auto; margin-bottom: 16px;
  scrollbar-width: none;
}
.tabs-header.style-underline::-webkit-scrollbar { display: none; }
.tabs-header.style-underline .tab-btn {
  padding: 10px 20px; font-size: 14px; font-weight: 500;
  background: transparent; color: var(--c-on-surface-v);
  border: none; border-bottom: 2px solid transparent;
  margin-bottom: -2px; white-space: nowrap;
  transition: color var(--transition), border-color var(--transition);
}
.tabs-header.style-underline .tab-btn:hover { color: var(--c-on-surface); background: var(--c-surface-1); }
.tabs-header.style-underline .tab-btn.active { color: var(--c-primary); border-bottom-color: var(--c-primary); font-weight: 600; }

/* ── Variante CAROUSEL (un onglet à la fois, flèches + compteur) ── */
.tabs-header.style-carousel {
  display: flex; align-items: center; justify-content: center;
  gap: 16px; margin-bottom: 16px; padding: 4px 0;
}
.tab-arrow {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; border: none;
  background: var(--c-surface-2); color: var(--c-on-surface); cursor: pointer;
  transition: background var(--transition);
}
.tab-arrow:hover { background: var(--c-surface-3); }
.tab-arrow .ms { font-size: 20px; }
.tab-carousel-info { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 120px; }
.tab-carousel-title { font-weight: 600; font-size: 15px; color: var(--c-on-surface); text-align: center; }
.tab-carousel-count { font-size: 12px; color: var(--c-on-surface-v); }

/* ── MODULE : Colonnes ── */
.mod-columns { }
.cols-inner { display: flex; gap: 20px; align-items: flex-start; }
.col-item { flex: 1; min-width: 0; }
.col-drop {
  min-height: 80px; padding: 12px;
  border-radius: var(--radius-sm);
  border: 1.5px dashed var(--c-outline-v);
  transition: background var(--transition), border-color var(--transition);
}
.col-drop.drag-over { background: var(--c-primary-cont); border-color: var(--c-primary); }
.col-resize-handle {
  width: 8px; cursor: col-resize; background: transparent;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; align-self: stretch;
}
.col-resize-handle::after {
  content: ''; width: 2px; height: 40px;
  background: var(--c-outline); border-radius: 1px;
}
.col-resize-handle:hover::after { background: var(--c-primary); }

/* ── MODULE : Citation ── */
.mod-quote { padding: 0; }
.quote-inner {
  border-left: 4px solid var(--c-primary);
  padding: 16px 20px 16px 24px;
  background: var(--c-primary-cont);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.quote-text {
  font-family: var(--font-display); font-style: italic;
  font-size: 18px; color: var(--c-on-surface); line-height: 1.6;
}
.quote-author {
  font-size: 13px; font-weight: 600; color: var(--c-primary);
  margin-top: 10px;
}

/* ── MODULE : Carte ── */
.mod-card { padding: 0; }
.card-inner {
  background: var(--c-surface);
  border: 1.5px solid var(--c-outline-v);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-2);
  transition: background var(--transition);
}
.card-img { width: 100%; height: 200px; object-fit: cover; display: block; }
.card-body { padding: 20px; }
.card-title { font-size: 18px; font-weight: 700; color: var(--c-on-surface); margin-bottom: 8px; }
.card-text { font-size: 14px; color: var(--c-on-surface-v); line-height: 1.6; }

/* ═══════════════════════════════════════════════════════════
   MODALS
═══════════════════════════════════════════════════════════ */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  z-index: 500; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(3px); display: none;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--c-surface); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-3); width: 90%; max-width: 520px;
  max-height: 85vh; overflow-y: auto;
  transition: background var(--transition);
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--c-outline-v);
}
.modal-header h2 { font-size: 18px; font-weight: 700; color: var(--c-on-surface); }
.modal-close {
  padding: 6px; border-radius: 50%; background: transparent;
  color: var(--c-on-surface-v); transition: background var(--transition);
}
.modal-close:hover { background: var(--c-surface-2); }
.modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
.export-spinner-wrap {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; min-height: 280px; color: var(--c-on-surface-v); font-size: 13px;
  text-align: center; padding: 0 16px;
}
.export-spinner {
  width: 30px; height: 30px; border-radius: 50%;
  border: 3px solid var(--c-outline-v); border-top-color: var(--c-primary);
  animation: export-spin .8s linear infinite;
}
@keyframes export-spin { to { transform: rotate(360deg); } }
.modal-footer { padding: 12px 24px 20px; display: flex; gap: 10px; justify-content: flex-end; }
.btn-primary {
  padding: 10px 20px; border-radius: var(--radius-sm);
  background: var(--c-primary); color: #fff;
  font-size: 14px; font-weight: 600;
  transition: opacity var(--transition);
}
.btn-primary:hover { opacity: .85; }
.btn-ghost {
  padding: 10px 20px; border-radius: var(--radius-sm);
  background: transparent; color: var(--c-on-surface-v);
  font-size: 14px; font-weight: 500; border: 1.5px solid var(--c-outline-v);
  transition: background var(--transition);
}
.btn-ghost:hover { background: var(--c-surface-2); }

/* Toast */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #1e2128; color: #e2e5ee;
  padding: 12px 20px; border-radius: 50px;
  font-size: 14px; font-weight: 500;
  box-shadow: var(--shadow-3); z-index: 9999;
  opacity: 0; transition: opacity 300ms;
  pointer-events: none; white-space: nowrap;
}
#toast.show { opacity: 1; }

/* File list in modals */
.file-list { max-height: 260px; overflow-y: auto; border: 1px solid var(--c-outline-v); border-radius: var(--radius-sm); }
.file-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; cursor: pointer; font-size: 13px;
  color: var(--c-on-surface); transition: background var(--transition);
  border-bottom: 1px solid var(--c-outline-v);
}
.file-item:last-child { border-bottom: none; }
.file-item:hover { background: var(--c-surface-2); }
.file-item .ms { font-size: 18px; color: var(--c-primary); }

/* Theme selector */
.theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.theme-card {
  padding: 14px 10px; border-radius: var(--radius-md);
  border: 2px solid var(--c-outline-v); cursor: pointer;
  text-align: center; font-size: 12px; font-weight: 600;
  transition: border-color var(--transition);
}
.theme-card:hover, .theme-card.active { border-color: var(--c-primary); }
.theme-swatch {
  display: flex; gap: 3px; justify-content: center; margin-bottom: 8px;
}
.swatch { width: 14px; height: 14px; border-radius: 50%; }

/* Scrollbar styling */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--c-outline); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--c-primary); }

/* Editable elements */
[contenteditable="true"] {
  outline: none;
  cursor: text;
}
